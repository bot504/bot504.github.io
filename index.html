<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kareem Elaswany</title>
<meta name="description" content="Kareem Elaswany — Automated Trading Systems Developer">
<meta property="og:title" content="Kareem Elaswany">
<meta property="og:description" content="مطوّر أنظمة تداول آلية | Automated Trading Systems Developer">
<meta name="theme-color" content="#070b14">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00b3b3;--gold:#f0b90b;--bg:#070b14;--card:rgba(18,26,42,.72);--line:rgba(255,255,255,.09);--muted:#9fb0c8}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:#e8edf5;min-height:100vh;display:flex;justify-content:center;padding:16px 14px 40px;overflow-x:hidden}
html[lang=en] body{font-family:'Inter','Cairo',sans-serif}
.bgimg{position:fixed;inset:0;z-index:-2;background-position:center top;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.6s ease;transform:scale(1.04)}
.bgimg.on{opacity:.34;animation:zoom 7s ease-out forwards}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.bgfade{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 0%,rgba(0,179,179,.22),transparent 45%),radial-gradient(circle at 100% 100%,rgba(240,185,11,.10),transparent 45%),linear-gradient(180deg,rgba(7,11,20,.15),rgba(7,11,20,.80) 60%)}
.pqr{background:#fff;border-radius:14px;padding:8px;width:170px;margin:6px auto 8px}.pqr img{width:100%;display:block}
.wrap{width:100%;max-width:440px}
.top{display:flex;justify-content:flex-end}
.lang{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:20px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(8px)}
.head{text-align:center;padding:10px 10px 18px}
.avatar{width:128px;height:128px;border-radius:50%;margin:0 auto 14px;padding:4px;background:conic-gradient(var(--teal),var(--gold),var(--teal));animation:spin 8s linear infinite}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg);animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:27px;font-weight:800;direction:ltr}
.role{margin-top:4px;color:#cfe;font-size:15px;font-weight:600}
.tags{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tag{font-size:12px;padding:3px 12px;border-radius:20px;background:rgba(0,179,179,.14);color:#5fe0e0;border:1px solid rgba(0,179,179,.35)}
.bio{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.8}
section{margin-top:18px}
.sec-t{font-size:13px;color:var(--muted);margin:0 4px 8px;font-weight:600;letter-spacing:.3px}
.links{display:flex;flex-direction:column;gap:10px}
a.btn,button.btn{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border-radius:16px;text-decoration:none;color:#fff;font:600 16px inherit;font-family:inherit;border:0;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:28px;height:28px;flex-shrink:0}
.btn .t{flex:1;text-align:start}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85;direction:ltr;text-align:start}
html[dir=rtl] .btn small{text-align:right}
.wa{background:#1fa855}.tg{background:#229ed9}
.ghost{background:var(--card)!important;border:1px solid var(--line)!important;backdrop-filter:blur(8px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(10px)}
.work{display:grid;gap:10px}
.w{display:flex;gap:12px;align-items:flex-start}
.w .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(0,179,179,.15)}
.w b{display:block;font-size:15px}
.w span{font-size:13px;color:var(--muted);line-height:1.6}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:85%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.7;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.bot{background:rgba(255,255,255,.07);align-self:flex-start;border-end-start-radius:4px}
.me{background:var(--teal);color:#fff;align-self:flex-end;border-end-end-radius:4px}
.typing{display:flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:transparent;border:1px solid rgba(0,179,179,.5);color:#5fe0e0;border-radius:18px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.chat a{color:var(--gold)}
.bot-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
/* pay */
.paytabs{display:flex;gap:8px;margin-bottom:14px}
.ptab{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer}
.ptab.on.ip{background:linear-gradient(90deg,#5b2c8f,#e8762c);border-color:transparent}
.ptab.on.vf{background:#e60000;border-color:transparent}
.pane{display:none;text-align:center}.pane.on{display:block}
.qr{background:#fff;border-radius:14px;padding:10px;width:200px;margin:4px auto 10px}
.qr img{width:100%;display:block}
.addr{direction:ltr;font-weight:800;font-size:18px;margin:4px 0 12px}
.ip .addr{color:var(--gold)}
.vfbadge{width:64px;height:64px;border-radius:50%;background:#e60000;margin:4px auto 10px;display:flex;align-items:center;justify-content:center}
.vfbadge svg{width:34px;height:34px}
.copy-ip{background:linear-gradient(90deg,#5b2c8f,#e8762c);justify-content:center}
.copy-vf{background:#e60000;justify-content:center}
.hint{font-size:12px;color:var(--muted);margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--teal);color:#fff;padding:10px 22px;border-radius:30px;font-weight:600;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:#5c6b82;font-size:12px;margin-top:24px}
</style>
</head>
